services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: contador-backend
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      POSTGRES_DB: ${POSTGRES_DB:-cpoints}
      POSTGRES_USER: ${POSTGRES_USER:-cpoints_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mY48%#CxzE912}
      POSTGRES_HOST: ${POSTGRES_HOST:-172.22.240.156}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-23v(z24j2ev07ihftj22&_y-mmw0)=pghp-xtq1ets=gv)wpgk}
    networks:
      - contador-network
    expose:
      - "8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn cpoints.wsgi:application --bind 0.0.0.0:8000 --workers 4"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: contador-frontend
    depends_on:
      - backend
    networks:
      - contador-network
    ports:
      - "80:80"
    environment:
      API_URL: http://backend:8000

  nginx:
    image: nginx:alpine
    container_name: contador-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - contador-network
networks:
  contador-network:
    driver: bridge
