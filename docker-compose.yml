version: '3.8'

services:
  pubg-contador:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pubg-contador
    ports:
      - "3000:3000"
    volumes:
      - pubg-data:/app/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production

volumes:
  pubg-data:
    driver: local
