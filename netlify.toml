[build]
  command = "npm run build:netlify"
  functions = "netlify/functions"
  publish = "dist/contador/browser"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200